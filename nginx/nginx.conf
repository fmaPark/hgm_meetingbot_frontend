# allnewmeetingbot/nginx/nginx.conf

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    resolver 127.0.0.11 valid=10s;

    upstream fast_api {
        server meeting_api:8000;
    }

    server {
        listen 80;
        server_name meetingbot.dony910.kro.kr; # 실제 도메인으로 변경
        
        root /var/www/html;
        index index.html;

        set $upstream_fast_api http://fast_api;
        # <<-- 1순위: API 및 Docs 경로 처리 -->>
        # /api/ 로 시작하는 모든 요청은 FastAPI로 전달
        location /api/ {
            # proxy_pass 주소 끝에 슬래시(/)를 추가하여 경로 재작성
            proxy_pass $upstream_fast_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # <<-- 2순위: 정적 파일 처리 -->>
        # .js, .css, 이미지 등 정적 파일은 직접 서빙
        location ~* \.(?:css|js|map|ico|svg|png|jpg|jpeg|gif|webp|woff|woff2|ttf|eot)$ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public";
        }

        # <<-- 3순위: 그 외 모든 요청 (Vue Router용) -->>
        # 위 두 규칙에 해당하지 않는 모든 요청은 index.html로 전달
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}